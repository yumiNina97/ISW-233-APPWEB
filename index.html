<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web Dinámica</title>
    <link rel="stylesheet" href="./vendor/normalize.css">
    <link rel="stylesheet" href="./pages/index.css">
</head>
<body class="page">
    <header class="header">
        <nav class="nav">
            <ul class="nav__links">
                <li><a href="#" class="nav__link">Inicio</a></li>
                <li><a href="#" class="nav__link">Acerca de</a></li>
                <li><a href="#" class="nav__link">Servicios</a></li>
                <li><a href="#" class="nav__link">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="content">
        <section class="todo-app">
            <h2 class="todo-app__title">Lista de Tareas (TODO App)</h2>
            <form class="todo-app__form">
                <input type="text" class="todo-app__input" placeholder="Añadir nueva tarea" required>
                <button type="submit" class="todo-app__button">Añadir</button>
            </form>
            <ul class="todo-app__list"></ul>
        </section>

        <section class="cards">
            <h2 class="cards__title">Películas Populares</h2>
            <div class="card-container"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__social">
            <a href="#" target="_blank"><img src="./images/facebook_white.svg" alt="Facebook" class="footer__social-icon"></a>
            <a href="#" target="_blank"><img src="./images/instagram_white.svg" alt="Instagram" class="footer__social-icon"></a>
        </div>
        <p class="footer__copyright">&copy; 2024 Yuvinca Nina. Todos los derechos reservados.</p>
    </footer>

    <template id="card-template">
        <div class="card">
            <img src="" alt="" class="card__image">
            <div class="card__info">
                <h3 class="card__title"></h3>
                <p class="card__overview"></p>
                <p class="card__release-date"></p>
                <p class="card__vote-average"></p>
            </div>
        </div>
    </template>

    <script type="module" src="./index.js"></script>
</body>
</html>
